<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base (Safe area maskable friendly) -->
  <rect width="512" height="512" rx="128" fill="url(#blueGrad)" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#60a5fa" stroke-width="8" stroke-dasharray="16 16" opacity="0.4" />
  
  <!-- Shield Outline -->
  <path d="M256 96 C320 96 384 128 384 180 C384 280 256 384 256 384 C256 384 128 280 128 180 C128 128 192 96 256 96 Z" fill="url(#shieldGlow)" filter="url(#dropShadow)" />
  <path d="M256 96 C320 96 384 128 384 180 C384 280 256 384 256 384 C256 384 128 280 128 180 C128 128 192 96 256 96 Z" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />

  <!-- Heart Center -->
  <path d="M256 280 C256 280 320 226 320 186 C320 162 300 144 276 144 C262 144 256 154 256 154 C256 154 250 144 236 144 C212 144 192 162 192 186 C192 226 256 280 256 280 Z" fill="#ffffff" />

  <!-- Checkmark Emblem -->
  <path d="M226 210 L248 232 L288 188" fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Calm Beacon Ring -->
  <circle cx="256" cy="256" r="6" fill="#38bdf8" />
</svg>
